name: Desplegar smart-trainer (rodillo.kitraining.app)

# Con cada push a main que toque smart-trainer: pasa los tests, compila y publica el sitio estático
# en el VPS 217.13.84.138 por SSH (antes: rama deploy-rodillo + Git de Plesk). En el VPS, kt-deploy
# lo deja en una release nueva y cambia la web de golpe. La clave de CI solo puede ejecutar kt-deploy.
on:
  push:
    branches: [main]
    paths:
      - 'smart-trainer/**'
      - '.github/workflows/deploy-rodillo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rodillo
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-trainer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-trainer/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preparar sitio estático
        run: |
          rm -rf dist/server
          find dist -name '*.map' -delete

      - name: Publicar en el VPS
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy@217.13.84.138 "rodillo ${GITHUB_SHA}"

      - name: Comprobar
        run: |
          set -euo pipefail
          live=$(curl -fsS --max-time 20 "https://rodillo.kitraining.app/version.txt?t=$(date +%s)" | tr -d '[:space:]')
          [ "$live" = "$GITHUB_SHA" ] || { echo "::error::rodillo no sirve ${GITHUB_SHA} (sirve $live)"; exit 1; }
